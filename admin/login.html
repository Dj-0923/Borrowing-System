<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lendy — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Figtree', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          display: ['"Bricolage Grotesque"', 'Figtree', 'ui-sans-serif', 'system-ui', 'sans-serif']
        },
        colors: {
          cream: 'var(--cream)', card: 'var(--card)', ink: 'var(--ink)', muted: 'var(--muted)',
          line: 'var(--line)', tint: 'var(--tint)', brand: 'var(--brand)', 'brand-deep': 'var(--brand-deep)'
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="relative min-h-screen" style="background:var(--cream)">

<!-- Decorative teal band. Abstract plain shapes, not borrowed artwork. -->
<div class="absolute inset-x-0 top-0 h-[340px] sm:h-[390px] overflow-hidden" style="background:linear-gradient(160deg,var(--side-from),var(--side-to))" aria-hidden="true">
  <svg class="absolute inset-0 w-full h-full opacity-[.12]" viewBox="0 0 1000 390" preserveAspectRatio="xMidYMid slice">
    <rect x="30" y="160" width="210" height="150" rx="14" fill="#fff"/>
    <rect x="760" y="110" width="200" height="190" rx="14" fill="#fff"/>
    <circle cx="130" cy="75" r="38" fill="#fff"/>
    <circle cx="890" cy="75" r="30" fill="#fff"/>
    <rect x="395" y="25" width="210" height="140" rx="12" fill="#fff"/>
  </svg>
</div>

<div class="relative z-10 min-h-screen flex items-start justify-center px-4 pt-12 sm:pt-16 pb-16">
  <div id="app" class="w-full max-w-[520px]"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="login.js"></script>
</body>
</html>
