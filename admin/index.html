<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lendy — Equipment Dashboard</title>
<script>
  if (location.hostname === 'borrowing-system-lendy.firebaseapp.com') {
    location.replace('https://borrowing-system-lendy.web.app' + location.pathname + location.search + location.hash);
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Figtree', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          display: ['"Bricolage Grotesque"', 'Figtree', 'ui-sans-serif', 'system-ui', 'sans-serif']
        },
        colors: {
          cream: 'var(--cream)',
          card: 'var(--card)',
          ink: 'var(--ink)',
          muted: 'var(--muted)',
          line: 'var(--line)',
          tint: 'var(--tint)',
          brand: 'var(--brand)',
          'brand-deep': 'var(--brand-deep)',
          head: 'var(--head)'
        }
      }
    }
  };

<link rel="stylesheet" href="styles.css">
</head>
