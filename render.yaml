services:
  - type: web
    name: lendy-account-approval
    runtime: node
    plan: free
    buildCommand: cd approval-server && npm ci
    startCommand: node approval-server/index.js
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: borrowing-system-lendy
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://borrowing-system-lendy.web.app,https://borrowing-system-lendy.firebaseapp.com
